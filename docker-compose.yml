services:
  mariadb:
    image: mariadb:11.4
    container_name: app_mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: skibidi67
      MARIADB_DATABASE: app_db
      MARIADB_USER: admin
      MARIADB_PASSWORD: skibidi67ADMIN

    ports:
      - "3307:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  mariadb_data: