<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WW2 Flight Game</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link
    rel="stylesheet"
    href="/static/css/map.css">
</head>
<body>

  <canvas
          id="mapCanvas"
          width="1400"
          height="800"
  ></canvas>

  <div id="airportPopup" class="hidden">

    <h2 id="popupName">
      AIRPORT
    </h2>

    <p id="popupType">
      TYPE
    </p>

    <p id="popupICAO">
      ICAO
    </p>

    <p id="popupCoords">
      COORDS
    </p>

    <div class="popupButtons">

      <button id="primaryButton">
        ACTION
      </button>

      <button id="closePopup">
        BACK TO MAP
      </button>

    </div>

  </div>

  <script src="/static/js/map.js"></script>
</body>
</html>
