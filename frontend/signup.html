<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Sign Up | Flight Game</title>

	<link rel="stylesheet" href="./static/css/variables.css">
	<link rel="stylesheet" href="./static/css/base.css">
	<link rel="stylesheet" href="./static/css/pages/auth.css">
	<link rel="icon" type="image/x-icon" href="../favicon.ico">
	<script type="module" src="./static/js/auth/signup.js" defer></script>
</head>

<body>
	<header class="auth-navbar">
		<a class="auth-logo" href="./index.html" aria-label="Flight Game home">
			<span class="auth-logo__icon">✦</span>
			<span>Flight Game</span>
		</a>

		<nav class="auth-nav" aria-label="Authentication navigation">
			<a class="auth-nav__link" href="./login.html">Login</a>
			<a class="auth-nav__link auth-nav__link--active" href="./signup.html">Sign up</a>
		</nav>
	</header>

	<main class="auth-page">
		<section class="auth-card" aria-labelledby="signup-title">
			<div class="auth-card__header">
				<p class="auth-eyebrow">New pilot</p>

				<h1 class="auth-card__title" id="signup-title">
					Sign up
				</h1>

				<p class="auth-card__text">
					Create your account using only username and password.
				</p>
			</div>

			<form class="auth-form" data-signup-form>
				<p class="status-message" data-status-message role="alert"></p>

				<label class="form-field">
					<span class="form-label">Username</span>

					<input
						class="form-input"
						type="text"
						name="username"
						autocomplete="username"
						placeholder="e.g. spitfire07"
						required
						minlength="3"
					>
				</label>

				<label class="form-field">
					<span class="form-label">Password</span>

					<input
						class="form-input"
						type="password"
						name="password"
						autocomplete="new-password"
						placeholder="At least 8 characters"
						required
						minlength="8"
					>
				</label>

				<label class="form-field">
					<span class="form-label">Confirm password</span>

					<input
						class="form-input"
						type="password"
						name="confirmPassword"
						autocomplete="new-password"
						placeholder="Repeat password"
						required
						minlength="8"
					>
				</label>

				<button class="button button--primary" type="submit" data-submit-button>
					Create account
				</button>
			</form>

			<p class="auth-switch">
				Already have an account?
				<a href="./login.html">Login</a>
			</p>
		</section>
	</main>
</body>

</html>
