<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Iron Skies - Mission Briefing</title>

  <link rel="stylesheet" href="./static/css/variables.css" />
  <link rel="stylesheet" href="./static/css/splash.css" />

  <script type="module" src="./static/js/auth/pageGuard.js"></script>
</head>

<body class="splash-page splash-page--start">
  <main class="splash-card">
    <p class="splash-eyebrow">MISSION BRIEFING</p>

    <h1>HELSINKI IS UNDER ATTACK</h1>

    <div class="splash-divider"></div>

    <p class="splash-text">
      Enemy forces have reached Finnish airspace. Helsinki-Vantaa is the last shield
      standing between the homeland and occupation.
    </p>

    <p class="splash-text">
      Take off immediately. Defend Helsinki. Then push the enemy back across Europe.
    </p>

    <div class="splash-actions">
      <button class="splash-button splash-button--primary" type="button" data-start-campaign>
        DEFEND HELSINKI
      </button>

      <button class="splash-button" type="button" data-back-menu>
        MAIN MENU
      </button>
    </div>

    <p class="splash-status" data-splash-status></p>
  </main>

  <script type="module">
    import { APP_CONFIG } from "./static/js/config.js"
    import { apiRequest } from "./static/js/apiClient.js"

    const startButton = document.querySelector("[data-start-campaign]")
    const backMenuButton = document.querySelector("[data-back-menu]")
    const statusText = document.querySelector("[data-splash-status]")

    const ACTIVE_GAME_SESSION_KEY = "ironSkiesActiveGameSessionId"

    startButton.addEventListener("click", async () => {
      try {
        startButton.disabled = true
        startButton.textContent = "STARTING..."
        statusText.textContent = "CREATING NEW CAMPAIGN..."

        const data = await apiRequest("/game/start", {
          method: "POST",
        })

        if (data.gameSessionId) {
          sessionStorage.setItem(ACTIVE_GAME_SESSION_KEY, String(data.gameSessionId))
          sessionStorage.setItem("gameSessionId", String(data.gameSessionId))
        }

        window.location.href = "./map.html"
      } catch (error) {
        console.error(error)

        startButton.disabled = false
        startButton.textContent = "DEFEND HELSINKI"
        statusText.textContent = error.message || "FAILED TO START CAMPAIGN"
      }
    })

    backMenuButton.addEventListener("click", () => {
      window.location.href = APP_CONFIG.routes.mainMenu
    })
  </script>
</body>

</html>
