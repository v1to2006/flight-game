<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iron Sky Project - Start Splash</title>

  <link rel="stylesheet" href="static/css/variables.css" />
  <link rel="stylesheet" href="static/css/startsplash.css" />
</head>
<body class="start-splash-body">
  <main class="story-splash">
    <div
      class="story-background"
      style="background-image: url('static/assets/backgrounds/helsinki-battle.png');"
    ></div>

    <div class="story-overlay"></div>
    <div class="story-grain"></div>
    <div class="story-particles"></div>

    <section class="story-panel">
      <p class="story-kicker">Classified Mission File</p>

      <h1 class="story-title">IRON SKY PROJECT</h1>

      <div class="story-message-box">
        <span class="story-message-label">Emergency Transmission</span>
        <p
          class="story-main-message typing-text"
          data-text="HELSINKI UNDER ATTACK. Enemy aircraft have breached the skies. Defend the homeland, break the enemy air network, and stop the super project before it reaches full power."
        ></p>
      </div>

      <div class="story-data">
        <p><span>Operation</span> Iron Sky</p>
        <p><span>Threat</span> Enemy super aerial project</p>
        <p><span>Primary Objective</span> Eliminate Super Project</p>
        <p><span>Status</span> Ready for Launch</p>
      </div>

      <div class="splash-actions">
        <a class="splash-btn splash-btn-primary" href="./map.html">Begin Mission</a>
      </div>
    </section>

    <audio id="pageMusic" loop preload="auto">
      <source src="static/assets/audio/startdust.wav" type="audio/wav" />
    </audio>
  </main>

  <script src="static/js/startsplash.js"></script>
</body>
</html>
