<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Iron Skies - Victory</title>

  <link rel="stylesheet" href="./static/css/variables.css" />
  <link rel="stylesheet" href="./static/css/splash.css" />

  <script type="module" src="./static/js/auth/pageGuard.js"></script>
</head>

<body class="splash-page splash-page--victory">
  <main class="splash-card splash-card--victory">
    <p class="splash-eyebrow">OPERATION COMPLETE</p>

    <h1>BERLIN HAS FALLEN</h1>

    <div class="splash-divider"></div>

    <p class="splash-text">
      The final enemy stronghold has been destroyed. Occupied airfields across Europe
      are free once again.
    </p>

    <p class="splash-text">
      Helsinki stood. Europe fought back. Victory belongs to the skies.
    </p>

    <div class="splash-actions">
      <button class="splash-button splash-button--primary" type="button" data-new-campaign>
        NEW CAMPAIGN
      </button>

      <button class="splash-button" type="button" data-back-menu>
        MAIN MENU
      </button>
    </div>
  </main>

  <script type="module">
    import { APP_CONFIG } from "./static/js/config.js"

    const newCampaignButton = document.querySelector("[data-new-campaign]")
    const backMenuButton = document.querySelector("[data-back-menu]")

    newCampaignButton.addEventListener("click", () => {
      window.location.href = "./startsplash.html"
    })

    backMenuButton.addEventListener("click", () => {
      window.location.href = APP_CONFIG.routes.mainMenu
    })
  </script>
</body>

</html>
