<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iron Sky Project - Victory Splash</title>

  <link rel="stylesheet" href="static/css/variables.css" />
  <link rel="stylesheet" href="static/css/victorySplash.css" />
</head>
<body class="victory-splash-body">
  <main class="story-splash victory-page">
    <div
      class="story-background"
      style="background-image: url('static/assets/backgrounds/berlin-liberated.png');"
    ></div>

    <div class="story-overlay"></div>
    <div class="story-grain"></div>
    <div class="story-particles"></div>

    <section class="story-panel">
      <p class="story-kicker">Final War Report</p>

      <h1 class="story-title">THE FALL OF IRON SKY</h1>

      <div class="story-message-box">
        <span class="story-message-label">Victory Transmission</span>
        <p
          class="story-main-message typing-text"
          data-text="BERLIN HAS FALLEN. VICTORY CONFIRMED. The enemy banner is coming down, their war machine is broken, and the mission stands complete."
        ></p>
      </div>

      <div class="story-data">
        <p><span>Outcome</span> Enemy super project destroyed</p>
        <p><span>Operation Result</span> Complete Victory</p>
        <p><span>Front Status</span> Berlin has fallen</p>
        <p><span>Report</span> Allied command confirms success</p>
      </div>

      <div class="story-actions">
        <a class="story-btn story-btn-primary" href="./credits.html">Continue</a>
      </div>
    </section>

    <audio id="pageMusic" loop preload="auto">
      <source src="static/assets/audio/enddust.wav" type="audio/wav" />
    </audio>
  </main>

  <script src="static/js/victorysplash.js"></script>
</body>
</html>
