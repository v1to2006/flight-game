<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>WW2 Flight Game - Campaign Map</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/frontend/static/css/map.css" />
</head>

<body>
  <canvas id="mapCanvas" width="1920" height="1080"></canvas>

  <div id="mapStatus" class="map-status">
    LOADING MAP...
  </div>

  <div id="airportPopup" class="hidden">
    <h2 id="popupName">AIRPORT</h2>

    <p id="popupType">TYPE</p>
    <p id="popupICAO">ICAO</p>
    <p id="popupCountry">COUNTRY</p>
    <p id="popupCoords">COORDS</p>

    <div class="popupButtons">
      <button id="primaryButton">START COMBAT</button>
      <button id="closePopup">BACK TO MAP</button>
    </div>
  </div>

  <script src="/frontend/static/js/map.js"></script>
</body>
</html>
